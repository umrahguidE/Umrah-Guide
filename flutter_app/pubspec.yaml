name: guided_umrah
description: "Guided Umrah: an offline-first companion that follows one pilgrim from preparation to the completion of Umrah."
publish_to: 'none'

# <name>+<build>. The release workflows override the build number on every run
# (--build-number), because Google Play and App Store Connect both reject a
# build number that was already uploaded.
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Storage, location and sensors
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  sensors_plus: ^7.1.0
  flutter_compass: ^0.8.1
  wakelock_plus: ^1.8.0
  vibration: ^3.2.1

  # Voice guide and recitations
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6

  # Real map (used only when far from Masjid al-Haram)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

  # Sharing and links
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Exported from the web app by scripts/export-flutter-data.mjs.
    - assets/data/
    - assets/i18n/
    # Recitations are fetched at build time (scripts/fetch-recitations.mjs)
    # and are not committed; the folders always exist (see their README).
    - assets/audio/
    - assets/audio/duas/

# Regenerate the launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0e6a44"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0e6a44"
    theme_color: "#0e6a44"
