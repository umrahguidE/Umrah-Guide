name: Android AAB (Play Store release)

# Builds a signed .aab (Android App Bundle) — the format Google Play
# requires for publishing. Unlike android-apk.yml (an unsigned test build
# on every push), this only runs when you deliberately ask for it — by
# hand, or by pushing a version tag such as v1.0.1 — since each run is a
# real release candidate.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 is what targets Android 16 (API 36) — Google Play has
      # required that for new apps and updates since 31 Aug 2026. It needs
      # Node 22 and Java 21 (Capacitor 6 targeted API 34 and Play rejects it).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Unit tests
        run: npm test

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Fetch the Qur'an recitations
        run: npm run audio:fetch

      - name: Build the web app
        run: npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Check it targets a Play-accepted Android version
        run: |
          grep -E "targetSdkVersion|compileSdkVersion" android/variables.gradle
          grep -Eq "targetSdkVersion = (3[6-9]|[4-9][0-9])" android/variables.gradle \
            || { echo "::error::targetSdkVersion is below 36 — Google Play will reject this bundle."; exit 1; }

      - name: Allow location and motion sensors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          xml = p.read_text(encoding='utf-8')
          perms = [
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACTIVITY_RECOGNITION',
            'android.permission.HIGH_SAMPLING_RATE_SENSORS',
            'android.permission.WAKE_LOCK',
          ]
          block = '\n'.join(f'    <uses-permission android:name="{name}" />' for name in perms if name not in xml)
          if block:
              xml = xml.replace('</manifest>', block + '\n</manifest>')
              p.write_text(xml, encoding='utf-8')
          print(xml)
          PY

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Google Play refuses a second upload with the same versionCode, so
      # every build gets a higher one (the workflow run number). The
      # patches below fail the job loudly if the Capacitor template ever
      # changes shape, rather than quietly producing an unsigned bundle.
      - name: Wire up release signing and version number
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          p = Path('android/app/build.gradle')
          g = p.read_text(encoding='utf-8')
          signing = '''
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("STOREPASS")
                      keyAlias System.getenv("ALIAS")
                      keyPassword System.getenv("KEYPASS")
                  }
              }
          '''
          g = g.replace('android {', 'android {\n' + signing, 1)
          g = g.replace('buildTypes {\n        release {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release')
          version = json.load(open('package.json'))['version']
          g, n_code = re.subn(r'versionCode \d+', 'versionCode ' + os.environ['RUN_NUMBER'], g, count=1)
          g, n_name = re.subn(r'versionName "[^"]*"', 'versionName "' + version + '"', g, count=1)
          if 'signingConfigs {' not in g or 'signingConfig signingConfigs.release' not in g or not n_code or not n_name:
              print('::error::Could not patch android/app/build.gradle (signing/version) — template changed?')
              print(g)
              sys.exit(1)
          p.write_text(g, encoding='utf-8')
          print(g)
          PY

      - name: Assemble release AAB
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # PKCS12 keystores (the JDK's default since Java 9, and what
          # keytool actually produced) don't support a key password
          # different from the store password — keytool silently ignores
          # a distinct one at generation time, so the two must match here
          # too, or signing fails with a decryption error.
          KEYPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew bundleRelease --no-daemon

      - name: Remove the keystore from the build workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Name the file
        run: cp android/app/build/outputs/bundle/release/app-release.aab guided-umrah.aab

      - uses: actions/upload-artifact@v4
        with:
          name: guided-umrah-aab
          path: guided-umrah.aab
