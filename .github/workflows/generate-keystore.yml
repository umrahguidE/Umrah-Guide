name: Generate Android release keystore (one-time)

# Run this ONCE to create the signing key for Google Play releases, then
# delete this workflow file. It never prints the keystore or its passwords
# anywhere — it only uploads the keystore file itself as a private build
# artifact, downloadable only by people with access to this repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the keystore
        env:
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -genkeypair -v \
            -keystore guided-umrah-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STOREPASS" -keypass "$KEYPASS" \
            -dname "CN=Guided Umrah, OU=Guided Umrah, O=Guided Umrah, C=SA" \
            -noprompt
          keytool -exportcert -alias "$ALIAS" -keystore guided-umrah-release.keystore \
            -storepass "$STOREPASS" -rfc -file fingerprint-cert.pem
          echo "SHA-256 fingerprint (safe to share, needed for Play Console app signing):"
          keytool -list -v -keystore guided-umrah-release.keystore -storepass "$STOREPASS" -alias "$ALIAS" | grep "SHA256:"

      - uses: actions/upload-artifact@v4
        with:
          name: guided-umrah-release-keystore
          path: guided-umrah-release.keystore
          retention-days: 7
