name: Android APK

# Builds an installable test APK in the cloud and attaches it to the "latest"
# release, so it can be downloaded straight onto a phone. No Android Studio
# needed locally.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy standalone "tools" SDK package; the
          # action's default ("tools platform-tools") now fails outright.
          # Gradle downloads whatever platform/build-tools it needs itself.
          packages: 'platform-tools'

      - name: Unit tests
        run: npm test

      - name: Install Capacitor
        run: npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      # Real recitation (tajwīd) for the Qur'anic verses. The recordings belong
      # to their reciters and publishers, so they are fetched at build time
      # rather than committed — check the terms before publishing the app.
      - name: Fetch the Qur'an recitations
        run: npm run audio:fetch

      - name: Build the web app
        run: npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Allow location and motion sensors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          xml = p.read_text(encoding='utf-8')
          perms = [
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACTIVITY_RECOGNITION',
            'android.permission.HIGH_SAMPLING_RATE_SENSORS',
            'android.permission.WAKE_LOCK',
          ]
          block = '\n'.join(f'    <uses-permission android:name="{name}" />' for name in perms if name not in xml)
          if block:
              xml = xml.replace('</manifest>', block + '\n</manifest>')
              p.write_text(xml, encoding='utf-8')
          print(xml)
          PY

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk guided-umrah.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guided-umrah-apk
          path: guided-umrah.apk

      - name: Publish it as the latest test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest guided-umrah.apk \
            --prerelease \
            --title "Guided Umrah — test build" \
            --notes "Unsigned debug build for testing on your own phone.

          To install: open this page on the phone, download guided-umrah.apk, and allow installing from unknown sources when Android asks.

          The religious guidance in this build is a DRAFT and has not been reviewed by scholars. Do not distribute it publicly until docs/CONTENT_REVIEW.md has been signed off."
